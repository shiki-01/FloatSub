# XcodeGen 定義。Xcode プロジェクトは CI 上で生成する（リポジトリには含めない）。
# 環境変数 BUNDLE_ID_PREFIX / DEVELOPMENT_TEAM は workflow 側で必ず設定する。
name: FloatSub
options:
  bundleIdPrefix: ${BUNDLE_ID_PREFIX}
  deploymentTarget:
    iOS: "${IOS_DEPLOYMENT_TARGET}"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    APP_GROUP_ID: group.${BUNDLE_ID_PREFIX}.floatsub
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: 0.12.4
targets:
  FloatSub:
    type: application
    platform: iOS
    sources:
      - FloatSub
      - Shared
    info:
      path: FloatSub/Info.plist
      properties:
        CFBundleDisplayName: FloatSub
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        AppGroupID: $(APP_GROUP_ID)
        BroadcastExtensionID: ${BUNDLE_ID_PREFIX}.floatsub.broadcast
        NSSpeechRecognitionUsageDescription: 取り込んだ音声を端末内で文字起こしするために使用します。
        NSMicrophoneUsageDescription: 対面会話や講義などの音声を端末内で文字起こしするために使用します。音声は端末の外へ送信されません。
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: FloatSub/FloatSub.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.floatsub
        GENERATE_INFOPLIST_FILE: NO
        # XcodeGen はターゲット単位で "1,2" を設定するため、ターゲット側で iPhone のみに上書きする
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: FloatSubBroadcast
      - target: FloatSubWidgets
      - package: FluidAudio
  FloatSubWidgets:
    type: app-extension
    platform: iOS
    sources:
      - FloatSubWidgets
      - path: Shared/FloatSubIntents.swift
    info:
      path: FloatSubWidgets/Info.plist
      properties:
        CFBundleDisplayName: FloatSub
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: FloatSubWidgets/FloatSubWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.floatsub.widgets
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - sdk: WidgetKit.framework
  FloatSubBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: FloatSubBroadcast
      - path: Shared
        excludes:
          - FloatSubIntents.swift
    info:
      path: FloatSubBroadcast/Info.plist
      properties:
        CFBundleDisplayName: FloatSub Broadcast
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: FloatSubBroadcast/FloatSubBroadcast.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.floatsub.broadcast
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - sdk: ReplayKit.framework
