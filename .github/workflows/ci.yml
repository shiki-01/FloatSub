name: CI

# 署名なしのコンパイル確認。Secrets 不要。
on:
  push:
  workflow_dispatch:

env:
  BUNDLE_ID_PREFIX: ${{ vars.BUNDLE_ID_PREFIX || 'com.example' }}
  DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM || 'XXXXXXXXXX' }}

jobs:
  compile:
    runs-on: ${{ matrix.runner }}
    # 検証プローブ構成は結果の報告が目的のため、失敗しても CI 全体は失敗にしない
    continue-on-error: ${{ matrix.conditions != '' }}
    env:
      IOS_DEPLOYMENT_TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 基準線: 一般提供の macOS 26 イメージ（iOS 26.5 SDK）
          - name: sdk26
            runner: macos-26
            target: '26.0'
            conditions: ''
          # iOS 27 SDK（xcode-27 ランナーはプレビュー提供）
          - name: sdk27
            runner: xcode-27
            target: '27.0'
            conditions: ''
          # iOS 27 SDK で ScreenCaptureKit 検証プローブをビルド
          - name: sdk27-sck-probe
            runner: xcode-27
            target: '27.0'
            conditions: 'SCK_PROBE'
    name: compile (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - name: 環境情報
        run: |
          ls /Applications | grep -i xcode || true
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios
      - name: ScreenCaptureKit の SDK 提供状況
        run: |
          # iOS SDK で import ScreenCaptureKit が通るかを直接確認する
          echo 'import ScreenCaptureKit' > /tmp/sck_check.swift
          if xcrun --sdk iphoneos swiftc -typecheck -target arm64-apple-ios26.0 /tmp/sck_check.swift; then
            echo "RESULT: ScreenCaptureKit は iOS SDK で import 可能"
          else
            echo "RESULT: ScreenCaptureKit は iOS SDK で import 不可"
          fi
          ls "$(xcrun --sdk iphoneos --show-sdk-path)/System/Library/Frameworks" | grep -i ScreenCapture || echo "SDK 内に ScreenCaptureKit.framework なし"
      - name: ScreenCaptureKit ヘッダーの iOS 可否一覧
        run: |
          H="$(xcrun --sdk iphoneos --show-sdk-path)/System/Library/Frameworks/ScreenCaptureKit.framework/Headers"
          ls "$H" || exit 0
          echo "---- @interface / @protocol と可用性（ios を含む行）"
          grep -nE "^@interface|^@protocol|API_AVAILABLE|API_UNAVAILABLE|NS_SWIFT_UNAVAILABLE|API_DEPRECATED" "$H"/*.h | grep -i "ios" | head -150
          echo "---- iOS 向けと明記された宣言（API_AVAILABLE(...ios...)）"
          grep -nE "API_AVAILABLE\(.*ios\(" "$H"/*.h | head -60
      - name: ScreenCaptureKit 主要ヘッダーの宣言本体（コメント除去）
        run: |
          H="$(xcrun --sdk iphoneos --show-sdk-path)/System/Library/Frameworks/ScreenCaptureKit.framework/Headers"
          [ -d "$H" ] || exit 0
          for f in SCContentSharingPicker.h SCStream.h; do
            echo "=================== $f"
            perl -0pe 's{/\*.*?\*/}{}gs' "$H/$f" | grep -vE '^\s*$|^\s*//|^#import|^NS_ASSUME|^NS_ASSUME_NONNULL' | sed -E 's/^(.{0,250}).*/\1/' | head -400
          done
      - name: XcodeGen
        run: brew install xcodegen && xcodegen generate
      - name: Build（署名なし）
        run: |
          set -o pipefail
          xcodebuild build \
            -project FloatSub.xcodeproj -scheme FloatSub \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) ${{ matrix.conditions }}' \
            | tee build.log | tail -n 80
