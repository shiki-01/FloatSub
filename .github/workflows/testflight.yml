name: TestFlight

# 署名済みビルドを作成し、App Store Connect（TestFlight）へアップロードする。手動実行。
on:
  workflow_dispatch:
    inputs:
      sck_probe:
        description: ScreenCaptureKit 検証ボタンを含める
        type: boolean
        default: true

env:
  BUNDLE_ID_PREFIX: ${{ vars.BUNDLE_ID_PREFIX }}
  DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
  IOS_DEPLOYMENT_TARGET: '27.0'

jobs:
  testflight:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: 必須設定の確認
        run: |
          for v in BUNDLE_ID_PREFIX DEVELOPMENT_TEAM; do
            [ -n "${!v}" ] || { echo "Repository variable $v が未設定です"; exit 1; }
          done
          for s in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!s}" ] || { echo "Secret $s が未設定です"; exit 1; }
          done
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      - name: Xcode の選択（27.2 を優先）
        run: |
          if [ -d /Applications/Xcode_27.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iOS 27" || true
      - name: XcodeGen
        run: brew install xcodegen && xcodegen generate
      - name: API キーを配置
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      - name: App Store Connect API 認証の事前確認（値は出力しない）
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" >/dev/null
          "$RUNNER_TEMP/venv/bin/pip" install -q pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import os, re, time, json, urllib.request, urllib.error, jwt
          kid = os.environ["ASC_KEY_ID"]; iss = os.environ["ASC_ISSUER_ID"]
          path = os.path.join(os.environ["RUNNER_TEMP"], "keys", f"AuthKey_{kid}.p8")
          pem = open(path).read()
          print("Key ID の形式(英数字10文字):", bool(re.fullmatch(r"[A-Z0-9]{10}", kid)))
          print("Issuer ID の形式(UUID):", bool(re.fullmatch(r"[0-9a-fA-F-]{36}", iss)))
          print("p8 の行数:", len(pem.strip().splitlines()),
                "/ BEGIN 行:", "BEGIN PRIVATE KEY" in pem, "/ END 行:", "END PRIVATE KEY" in pem)
          try:
              now = int(time.time())
              token = jwt.encode({"iss": iss, "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
                                 pem, algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
          except Exception as e:
              print("JWT の生成に失敗（p8 の内容が不正）:", type(e).__name__); raise SystemExit(1)
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?limit=200",
                                       headers={"Authorization": f"Bearer {token}"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = json.load(r)
                  ids = [a["attributes"].get("bundleId") for a in body.get("data", [])]
                  print("HTTP", r.status, "/ 登録済みアプリの Bundle ID:", ids)
                  expected = os.environ["BUNDLE_ID_PREFIX"] + ".floatsub"
                  print("期待する Bundle ID が存在:", expected in ids)
          except urllib.error.HTTPError as e:
              print("HTTP", e.code, "（401: Key ID / Issuer ID / p8 の不一致、403: 権限不足）"); raise SystemExit(1)

          # 署名（provisioning）に必要な権限と、Bundle ID / 機能の登録状況を確認する
          def get(path):
              r = urllib.request.Request("https://api.appstoreconnect.apple.com" + path,
                                         headers={"Authorization": f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(r, timeout=30) as resp:
                      return resp.status, json.load(resp)
              except urllib.error.HTTPError as e:
                  return e.code, None
          prefix = os.environ["BUNDLE_ID_PREFIX"]
          st, certs = get("/v1/certificates?limit=200")
          if certs:
              print("証明書 HTTP", st, "種別:", sorted({c["attributes"].get("certificateType") for c in certs["data"]}))
              for c in certs["data"]:
                  at = c["attributes"]
                  print("  証明書:", at.get("certificateType"), "/", at.get("name"), "/ 有効期限", at.get("expirationDate"), "/ id", c["id"])
          else:
              print("証明書 HTTP", st, "（403 ならキーの権限が Admin / App Manager 未満の可能性）")
          st, bids = get("/v1/bundleIds?limit=200")
          print("Bundle ID 一覧 HTTP", st)
          if bids:
              for b in bids["data"]:
                  ident = b["attributes"].get("identifier", "")
                  if ident.startswith(prefix + ".floatsub"):
                      st2, caps = get(f"/v1/bundleIds/{b['id']}/bundleIdCapabilities")
                      kinds = sorted(c["attributes"].get("capabilityType") for c in caps["data"]) if caps else f"HTTP {st2}"
                      print(" ", ident, "→ 機能:", kinds)
              have = {b["attributes"].get("identifier") for b in bids["data"]}
              for need in (prefix + ".floatsub", prefix + ".floatsub.broadcast", prefix + ".floatsub.widgets"):
                  print(" 登録あり" if need in have else " 未登録", need)
          st, profs = get("/v1/profiles?limit=200")
          print("プロファイル HTTP", st, "件数:", len(profs["data"]) if profs else "-")
          PY
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      - name: Archive
        run: |
          set -o pipefail
          CONDITIONS='$(inherited)'
          [ "${{ inputs.sck_probe }}" = "true" ] && CONDITIONS="$CONDITIONS SCK_PROBE"
          xcodebuild archive \
            -project FloatSub.xcodeproj -scheme FloatSub \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FloatSub.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="$CONDITIONS" \
            | tail -n 60
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      - name: Export と TestFlight へのアップロード
        run: |
          # tail にパイプしても xcodebuild の失敗を検知できるようにする
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${DEVELOPMENT_TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FloatSub.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 40
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
